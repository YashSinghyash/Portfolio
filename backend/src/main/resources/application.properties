spring.application.name=portfolio

# --- Database ---
# File-based H2 database for now (zero setup, data persists in ./data/portfolio.mv.db).
# To switch to MySQL/Postgres later, just replace these 4 lines with the matching
# driver/url/username/password and add the driver dependency to pom.xml.
spring.datasource.url=jdbc:h2:file:./data/portfolio;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# We manage the schema ourselves via schema.sql/data.sql (see resources/), so
# Hibernate should not try to auto-generate or alter tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

# Handy for peeking at the data during development: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
