spring.application.name=rate-limiter
server.port=8084

# File-based H2 for local dev. Swapping to MySQL later is just this datasource
# block + the driver dependency in pom.xml -- schema.sql/data.sql are plain SQL.
spring.datasource.url=jdbc:h2:file:./data/rate-limiter;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
